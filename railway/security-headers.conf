# Security headers, included by nginx.conf.template. add_header is inherited
# into a location only if that location sets none of its own, so this file is
# included at server level AND in every location that adds a header (cache
# rules). `always` puts them on error responses too.
#
# Deliberately not sent: HSTS (Railway's edge terminates TLS; set it on the
# domain there) and a full Content-Security-Policy (the app needs wasm, inline
# styles and cross-origin API/images) — only frame-ancestors, against clickjacking.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;
